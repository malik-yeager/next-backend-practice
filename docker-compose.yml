version: "3.9"

services:
  db:
    image: postgres:15
    container_name: nextblog_db
    restart: always
    environment:
      POSTGRES_USER: Malik
      POSTGRES_PASSWORD: Malik@1234
      POSTGRES_DB: nextblog
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
